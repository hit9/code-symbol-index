[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-symbol-index"
version = "0.6.2"
description = "Tree-sitter backed symbol search and inspection for codebases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hit9", email = "hit9@icloud.com" }]
dependencies = [
  "pathspec",
  "tree-sitter>=0.26.0",
  "tree-sitter-language-pack>=1.12.5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.14"]

[project.scripts]
code-symbol-index = "code_symbol_index:main"

[tool.setuptools]
py-modules = ["code_symbol_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Trace-callback lambdas intentionally capture loop variables.
"tests/test_code_symbol_index.py" = ["B023"]
